spring.application.name=trampoja-api

# Em produção (Render) lê as variáveis; localmente usa os valores padrão após os dois pontos
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/TrampoJa}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Porta dinâmica exigida pelo Render (localmente continua 8080)
server.port=${PORT:8080}

# Minimo de 32 caracteres (HS256). Em producao defina a variavel JWT_SECRET.
jwt.secret=${JWT_SECRET:trampoja-chave-secreta-dev-troque-em-producao-123456}
jwt.expiration=86400000